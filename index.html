<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Chat App</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0b1220;
  color: white;
  display: flex;
  flex-direction: column;
  height: 100vh;
}

#chat {
  flex: 1;
  padding: 12px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.msg {
  padding: 10px;
  border-radius: 12px;
  max-width: 75%;
  word-wrap: break-word;
}

.user {
  background: #3b82f6;
  align-self: flex-end;
}

.ai {
  background: #1f2937;
  align-self: flex-start;
}

#inputBar {
  display: flex;
  padding: 10px;
  background: #111827;
  gap: 10px;
}

input {
  flex: 1;
  padding: 12px;
  border: none;
  border-radius: 10px;
  outline: none;
}

button {
  padding: 12px 16px;
  border: none;
  border-radius: 10px;
  background: #22c55e;
  color: white;
  font-weight: bold;
}
</style>

</head>

<body>

<div id="chat"></div>

<div id="inputBar">
  <input id="input" placeholder="Ask something..." />
  <button onclick="send()">Send</button>
</div>

<script>
const API = "https://my-ai-app.potapenkomilan.workers.dev";

function addMsg(text, type) {
  const div = document.createElement("div");
  div.className = "msg " + type;
  div.innerText = text;
  document.getElementById("chat").appendChild(div);
  document.getElementById("chat").scrollTop = 999999;
}

async function send() {
  const input = document.getElementById("input");
  const text = input.value.trim();
  if (!text) return;

  addMsg(text, "user");
  input.value = "";

  try {
    const res = await fetch(API, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message: text
      })
    });

    const data = await res.json();
    addMsg(data.reply || "No response", "ai");

  } catch (err) {
    addMsg("Error: " + err.message, "ai");
  }
}

// ENTER key support
document.getElementById("input").addEventListener("keydown", function(e) {
  if (e.key === "Enter") send();
});
</script>

</body>
</html>

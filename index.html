<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Chat</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0b1220;
  color: white;
  display: flex;
  flex-direction: column;
  height: 100vh;
}

#chat {
  flex: 1;
  padding: 10px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.msg {
  padding: 10px;
  border-radius: 12px;
  max-width: 75%;
}

.user {
  background: #3b82f6;
  align-self: flex-end;
}

.ai {
  background: #1f2937;
  align-self: flex-start;
}

#bar {
  display: flex;
  padding: 10px;
  background: #111827;
  gap: 10px;
}

input {
  flex: 1;
  padding: 12px;
  border-radius: 10px;
  border: none;
}

button {
  padding: 12px;
  border: none;
  border-radius: 10px;
  background: #22c55e;
  color: white;
}
</style>

</head>

<body>

<div id="chat"></div>

<div id="bar">
  <input id="input" placeholder="Ask something..." />
  <button onclick="send()">Send</button>
</div>

<script>
const API = "https://my-ai-app.potapenkomilan.workers.dev";

function add(text, type) {
  const d = document.createElement("div");
  d.className = "msg " + type;
  d.innerText = text;
  document.getElementById("chat").appendChild(d);
  document.getElementById("chat").scrollTop = 999999;
}

async function send() {
  const input = document.getElementById("input");
  const text = input.value.trim();
  if (!text) return;

  add(text, "user");
  input.value = "";

  try {
    const res = await fetch(API, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text })
    });

    const data = await res.json();
    add(data.reply || "No response", "ai");

  } catch (e) {
    add("Error: " + e.message, "ai");
  }
}

document.getElementById("input").addEventListener("keydown", e => {
  if (e.key === "Enter") send();
});
</script>

</body>
</html>
